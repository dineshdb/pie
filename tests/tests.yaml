# pie CLI integration tests
#
# Assertion layers (all checked, all failures reported):
#   contains      - pattern(s) that MUST appear in stdout (response)
#   not_contains  - pattern(s) that must NOT appear in stdout
#   tools         - tool name(s) that must appear in structured stderr events
#   tool_calls    - list of {name, input}; input is a JSON subset match:
#                   dict keys must exist, string values are substring-matched
#   tasks         - task name substring(s) that must appear in task_add events
#   task_count    - minimum number of tasks created
#
# Other fields:
#   name          - test description (required)
#   args          - CLI flags (e.g. --json)
#   input         - query string sent to the model
#   exit          - expected exit code (omit = don't check)
#   timeout       - max seconds to wait (default 30)
#   post          - shell command to run after main test (exit 0 = pass)

tests:
  # ── Shell tool with command validation ────────────────────────
  - name: shell tool executes system commands
    input: "What is the architecture of this laptop?"
    tools:
      - shell
    tool_calls:
      - name: shell
        input:
          cmd: "uname"
    contains:
      - Darwin
      - arm64
    timeout: 60

  # ── JSON output format ───────────────────────────────────────
  - name: json output format is valid
    args: --json
    input: "what is 2+2"
    contains:
      - '"response"'
      - '"session_id"'
    not_contains:
      - "```"
    timeout: 30

  # ── Agent delegation via subsume ─────────────────────────────
  - name: explore agent delegates via subsume
    input: "/explore this project"
    tools:
      - subsume
    tool_calls:
      - name: subsume
        input:
          agent: "explore"
    contains:
      - Rust
    timeout: 120

  # ── Task lifecycle: creation, updates, completion ────────────
  - name: task lifecycle creates and updates tasks
    input: "Create a file hello.txt with 'hello world' and verify it exists."
    tools:
      - task_add
      - task_update
      - write_file
    tasks:
      - hello
    task_count: 2
    contains:
      - "hello world"
    timeout: 120
