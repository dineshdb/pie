# pie CLI integration tests
#
# Assertion layers (all checked, all failures reported):
#   contains      - pattern(s) that MUST appear in stdout (response)
#   not_contains  - pattern(s) that must NOT appear in stdout
#   tools         - tool name(s) that must appear in structured stderr events
#   tool_calls    - list of {name, input}; input is a JSON subset match:
#                   dict keys must exist, string values are substring-matched
#   steps         - step name substring(s) that must appear in plan_set events
#   step_count    - minimum number of steps created
#
# Other fields:
#   name          - test description (required)
#   args          - CLI flags (e.g. --json)
#   input         - query string sent to the model
#   exit          - expected exit code (omit = don't check)
#   timeout       - max seconds to wait (default 30)
#   post          - shell command to run after main test (exit 0 = pass)

tests:
  # ── Shell tool with command validation ────────────────────────
  - name: shell tool executes system commands
    input: "Find what is the architecture of this laptop?"
    contains:
      - arm64
    timeout: 60

  # ── JSON output format ───────────────────────────────────────
  - name: json output format is valid
    args: --json
    input: "what is 2+2"
    contains:
      - '"response"'
      - '"session_id"'
    not_contains:
      - "```"
    timeout: 30

  - name: List files
    input: "List files"
    contains:
      - "Cargo.toml"
    timeout: 60
