name = "developer"
version = "1.0.0"
description = "Consolidated developer plugin for repo context, quality checks, and safety guards"

[[hooks]]
name = "grounding"
event = "prompt.pre"
type = "cmd"
handler = "developer.py ground"
scope = "transform"
strategy = "parallel"

[[hooks]]
name = "memory-grounding"
event = "prompt.pre"
type = "cmd"
handler = "developer.py memory-ground"
scope = "transform"
strategy = "parallel"

[[hooks]]
name = "safety-guard"
event = "tool.pre"
type = "cmd"
handler = "developer.py guard"
scope = "validation"
on_failure = "abort"

[[hooks]]
name = "step-alignment"
event = "prompt.pre"
type = "cmd"
handler = "developer.py step-alignment"
scope = "transform"
strategy = "parallel"

[[hooks]]
name = "test-first-check"
event = "tool.pre"
type = "cmd"
handler = "developer.py test-first"
scope = "validation"
on_failure = "warn"
matcher = { tools = ["write_file", "replace"] }

[[hooks]]
name = "diff-sentinel"
event = "tool.post"
type = "cmd"
handler = "developer.py diff-sentinel"
matcher = { tools = ["write_file", "replace"] }

[[hooks]]
name = "doom-loop-detection"
event = "tool.post"
type = "cmd"
handler = "developer.py doom-loop"
scope = "transform"
matcher = { tools = ["shell"] }

[[hooks]]
name = "error-enrichment"
event = "tool.post"
type = "cmd"
handler = "developer.py diagnostic"
scope = "transform"
matcher = { tools = ["shell"] }

[[hooks]]
name = "final-verification"
event = "completion.pre"
type = "cmd"
handler = "developer.py verify"
scope = "transform"
timeout_ms = 300000
