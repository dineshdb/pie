[package]
name = "p1e"
version = "0.3.0"
edition = "2024"
default-run = "pie"
description = "A minimal AI coding agent with sandboxed command execution"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[workspace]
members = [".", "crates/p1e-sandbox", "crates/pie-core", "crates/pie-acp"]

[workspace.dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
jewels = { path = "../agentsdk/crates/jewels" }

[dependencies]
pie-core = { path = "crates/pie-core", version = "0.3.0" }
pie-acp = { path = "crates/pie-acp", version = "0.3.0" }
agentsdk = { path = "../agentsdk" }
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive", "env"] }
p1e-sandbox = { path = "crates/p1e-sandbox", version = "0.2.0" }
pulldown-cmark = "0.13"
tachyonfx = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-util", "io-std", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea-2 = "0.11"
tuirealm = { version = "4.0", features = ["termion"] }
termion = "4"
unicode-width = "0.2"
redact = { version = "0.1.11", features = ["serde"] }
serde_json.workspace = true
jewels.workspace = true

[lints]
workspace = true

[dev-dependencies]

[profile.release]
lto = true
panic = "abort"
strip = true

# Shared lint policy. Members opt in with `lints.workspace = true`.
[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2024_compatibility = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
future_not_send = "allow"
