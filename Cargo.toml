[package]
name = "p1e"
version = "0.3.0"
edition = "2024"
default-run = "pie"
description = "A minimal AI coding agent with sandboxed command execution"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[workspace]
members = [".", "crates/p1e-sandbox", "crates/jewels"]

[workspace.dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
jewels = { path = "crates/jewels" }

[dependencies]
agentsdk = { path = "../agentsdk" }
agentsdk-plugin-skills = { path = "../agentsdk/crates/agentsdk-plugin-skills" }
agentsdk-plugin-fs = { path = "../agentsdk/crates/agentsdk-plugin-fs" }
agentsdk-plugin-agentsmd = { path = "../agentsdk/crates/agentsdk-plugin-agentsmd" }
anyhow = "1"
arboard = "3"
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
croner = "3"
dirs.workspace = true
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
glob = "0.3"
include_dir = "0.7"
minijinja = { version = "2", features = ["json"] }
p1e-sandbox = { path = "crates/p1e-sandbox", version = "0.2.0" }
pulldown-cmark = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
itertools = "0.14"
tokio-stream = { version = "0.1", features = ["sync"] }

reqwest = { version = "0.13", features = ["json"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
jewels.workspace = true
serde_yaml = "0.9"
shell-words = "1.1"

strum = { version = "0.28", features = ["derive"] }
tachyonfx = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "io-std", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea-2 = "0.11"
tuirealm = { version = "4.0", features = ["termion"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
hostname = "0.4.2"
lexiclean = "0.0.1"
redact = { version = "0.1.11", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
thiserror = "2.0.18"
derive_more = { version = "2.1.1", features = ["display", "from"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
panic = "abort"
strip = true

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2024_compatibility = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
future_not_send = "allow"
