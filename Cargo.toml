[package]
name = "p1e"
version = "0.3.0"
edition = "2024"
default-run = "pie"
description = "A minimal AI coding agent with sandboxed command execution"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[workspace]
members = [".", "crates/p1e-sandbox", "crates/pie-core", "crates/pie-acp", "crates/pie-tui"]

[workspace.dependencies]
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
jewels = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
a2acp = { git = "ssh://git@github.com/qretaio/a2acp.git", branch = "main" }

[dependencies]
pie-core = { path = "crates/pie-core", version = "0.3.0" }
pie-acp = { path = "crates/pie-acp", version = "0.3.0" }
pie-tui = { path = "crates/pie-tui", version = "0.1.0" }
a2acp.workspace = true
axum = "0.8"
agentsdk = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
p1e-sandbox = { path = "crates/p1e-sandbox", version = "0.2.0" }
dirs.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-util", "io-std", "sync", "net"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redact = { version = "0.1.11", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
agent-client-protocol = "2.1.0"
serde_json.workspace = true
pie-core = { path = "crates/pie-core", version = "0.3.0", features = ["test-util"] }
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = true
panic = "abort"
strip = true

# Shared lint policy. Members opt in with `lints.workspace = true`.
[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2024_compatibility = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
future_not_send = "allow"
