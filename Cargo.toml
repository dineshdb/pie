[package]
name = "p1e"
version = "0.1.0"
edition = "2024"
default-run = "pie"
description = "A minimal AI coding agent with sandboxed command execution"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[workspace]
members = [".", "crates/p1e-srt"]

[workspace.dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[[bin]]
name = "p1e"
path = "src/main.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

[dependencies]
aisdk = { git = "https://github.com/qretaio/aisdk", features = ["openaicompatible", "openai"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs.workspace = true
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
include_dir = "0.7"
minijinja = "2"
p1e-srt = { path = "crates/p1e-srt" }
pulldown-cmark = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.31"
refinery = { version = "0.9", features = ["rusqlite"] }

reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yml = "0.0.12"
strum = { version = "0.28", features = ["derive"] }
tachyonfx = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea-2 = "0.10"
tuirealm = { version = "4.0", features = ["crossterm"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
panic = "abort"
strip = true
