[package]
name = "piebox-proto"
version = "0.1.0"
edition = "2024"
description = "Wire protocol between the piebox host and its in-guest supervisor"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Panic-safety: both ends of this protocol read bytes written by the other side.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
