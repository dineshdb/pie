[package]
name = "piebox"
version = "0.1.0"
edition = "2024"
description = "libkrun-backed Linux microVM devbox that hosts pie and its sandboxes"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
libloading = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true

[[bin]]
name = "piebox"
path = "src/bin/piebox.rs"

# Panic-safety: a proxy sits on hostile input and a VMM controller supervises a
# VM, so neither may abort on a malformed value. (The workspace table also
# turns on clippy::pedantic; adopting that here is a separate cleanup.)
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
