[package]
name = "pie-a2a"
version = "0.1.0"
edition = "2024"
description = "A2A server frontend for the pie agent: agent-to-agent delegation over streamable HTTP"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
pie-core = { path = "../pie-core", version = "0.3.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
tokio-stream = "0.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pie-core = { path = "../pie-core", version = "0.3.0", features = ["test-util"] }
redact = { version = "0.1.11", features = ["serde"] }
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
