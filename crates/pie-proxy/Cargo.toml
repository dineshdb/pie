[package]
name = "pie-proxy"
version = "0.1.0"
edition = "2024"
description = "Hostname-filtering egress proxy for pie sandboxes and piebox microVMs"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rama = { version = "0.4.0", features = ["http-full"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "signal",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "pie-proxy"
path = "src/bin/pie-proxy.rs"

# Panic-safety: a proxy sits on hostile input and a VMM controller supervises a
# VM, so neither may abort on a malformed value. (The workspace table also
# turns on clippy::pedantic; adopting that here is a separate cleanup.)
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
