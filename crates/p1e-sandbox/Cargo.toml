[package]
name = "p1e-sandbox"
version = "0.2.0"
edition = "2024"
description = "Native OS sandbox runtime for p1e — sandbox-exec (macOS) and bwrap (Linux)"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
tracing = "0.1"
# TODO(oauth): temporary local path — swap back to
# agentsdk = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
# once agentsdk main pushes add_remote_server_authorized.
agentsdk = { path = "../../../../agentsdk" }
async-trait = "0.1" 
tokio = { version = "1", features = ["full"] } 
glob = "0.3" 

