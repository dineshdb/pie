[package]
name = "p1e-sandbox"
version = "0.2.0"
edition = "2024"
description = "Native OS sandbox runtime for p1e — sandbox-exec (macOS) and bwrap (Linux)"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1"
tracing.workspace = true
agentsdk = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
# once agentsdk main pushes add_remote_server_authorized.
async-trait = "0.1"
# process + rt: the sandbox only spawns and waits on child processes.
tokio = { version = "1", features = ["process", "rt"] }
glob = "0.3"

