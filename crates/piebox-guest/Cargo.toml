[package]
name = "piebox-guest"
version = "0.1.0"
edition = "2024"
description = "Supervisor that runs inside a piebox guest and executes commands for the host"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
piebox-proto = { path = "../piebox-proto" }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "piebox-guest"
path = "src/main.rs"

# Panic-safety: this is pid 1's workload inside a VM, reading host input.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
