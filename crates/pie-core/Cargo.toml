[package]
name = "pie-core"
version = "0.3.0"
edition = "2024"
description = "The pie agent library: engine, plugins, config, sessions — no frontend"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
# { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
# once agentsdk main pushes add_remote_server_authorized. All agentsdk
# crates must move together or the git-sourced plugins would pull in a
# second, conflicting agentsdk instance.
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs.workspace = true
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
glob = "0.3"
include_dir = "0.7"
minijinja = { version = "2", features = ["json"] }
p1e-sandbox = { path = "../p1e-sandbox", version = "0.2.0" }
itertools = "0.15"
termion = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "net", "time"] }
tracing.workspace = true
uuid = { version = "1", features = ["v7", "serde"] }
hostname = "0.4.2"
lexiclean = "0.0.2"
open = "5"
redact = { version = "0.1.11", features = ["serde"] }
rmcp = { version = "3.4", features = ["client", "schemars", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "auth"] }
url = { version = "2.5.8", features = ["serde"] }
thiserror = "2.0.18"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
jewels.workspace = true
serde_yaml = "0.9"
shell-words = "1.1"
strum = { version = "0.28", features = ["derive"] }

agentsdk = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-skills = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-fs = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-agentsmd = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-jewels = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-mcp = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-shell = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-agentfs = { path = "../agentsdk-plugin-agentfs", version = "0.1.0" }
[lints]
workspace = true

[features]
test-util = []

[dev-dependencies]
tempfile = "3"
# The mcp_auth login test stubs rmcp's OAuthHttpClient, whose request and
# response types come from the oauth2 crate's re-export of http. Defaults
# are OFF: oauth2's `reqwest` default feature would drag a second reqwest
# (0.12) into the graph next to the 0.13 everything else uses — the test
# only needs the base crate's `http` re-export.
oauth2 = { version = "5", default-features = false }
# Real reqwest decode errors can't be fabricated — the retry-policy tests
# stand up a raw socket that lies about Content-Length and hangs up mid-body.
tokio = { version = "1", features = ["net"] }
