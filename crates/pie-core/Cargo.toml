[package]
name = "pie-core"
version = "0.3.0"
edition = "2024"
description = "The pie agent library: engine, plugins, config, sessions — no frontend"
license = "MIT"
repository = "https://github.com/dineshdb/pie"

[dependencies]
agentsdk = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-skills = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-fs = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-agentsmd = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-jewels = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-mcp = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
agentsdk-plugin-shell = { git = "https://github.com/dineshdb/agentsdk", branch = "main" }
anyhow = "1"
async-trait = "0.1"
cel = "0.14"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
croner = "4"
dirs.workspace = true
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
include_dir = "0.7"
minijinja = { version = "2", features = ["json"] }
p1e-sandbox = { path = "../p1e-sandbox", version = "0.2.0" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
itertools = "0.15"
termion = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
tracing.workspace = true
uuid = { version = "1", features = ["v7", "serde"] }
hostname = "0.4.2"
lexiclean = "0.0.2"
redact = { version = "0.1.11", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
thiserror = "2.0.18"
derive_more = { version = "2.1.1", features = ["display", "from"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
jewels.workspace = true
serde_yaml = "0.9"
shell-words = "1.1"
strum = { version = "0.28", features = ["derive"] }

[lints]
workspace = true

[features]
test-util = []

[dev-dependencies]
tempfile = "3"
# Real reqwest decode errors can't be fabricated — the retry-policy tests
# stand up a raw socket that lies about Content-Length and hangs up mid-body.
tokio = { version = "1", features = ["net"] }
